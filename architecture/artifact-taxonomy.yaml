taxonomy_version: 0.4.0
authority: Architecture Board
artifact_classes:
  OCP:
    normative_level: binding
    document_lifecycle: [Draft, Accepted, Canonical, Deprecated, Archived]
    concept_lifecycle: [Proposed, Under Review, Accepted, Canonical, Deferred, Deprecated, Archived]
    document_status_authority: Architecture Board
    concept_status_authority: Architecture Board
    numbering_authority: Architecture Board
    location: docs/
    external_review_required: true
    purpose: Domain and ontology specifications with independent document and Concept status axes.
  Pattern:
    normative_level: binding-when-invoked
    lifecycle: [Draft, Accepted, Deprecated, Archived]
    status_authority: Architecture Board
    numbering_authority: Architecture Board
    location: patterns/
    external_review_required: true
    invocation_metadata: Uses-Patterns
    version_format: semver
    invocation_version_policy: track-current
    version_change_requires_atomic_invoker_update: true
    purpose: Reusable modeling contracts without domain semantics.
  AD:
    normative_level: binding
    lifecycle: [Discovery, Under Review, Accepted, Superseded, Archived]
    status_authority: Architecture Board
    numbering_authority: Architecture Board
    location: architecture/discovery/
    external_review_required: true
    purpose: New architecture decisions and discovery that govern future artifacts.
  ADR:
    normative_level: binding
    lifecycle: [Draft, Accepted, Superseded, Archived]
    status_authority: Architecture Board
    numbering_authority: frozen
    location: adr/
    external_review_required: true
    new_ids_allowed: false
    purpose: Historical decision registry; existing ADR-DRAFT-007 completes its lifecycle here.
  AB:
    normative_level: record
    lifecycle: [Open, Proposed, Discovery, Deferred, Planned, Under Review, Resolved, Rejected]
    active_states: [Open, Proposed, Discovery, Under Review]
    status_authority: Architecture Board
    numbering_authority: Architecture Board
    location: backlog/architecture-backlog.md
    external_review_required: false
    purpose: Board backlog and decision accounting.
  Review:
    normative_level: record
    lifecycle: [Draft, Final]
    status_field_required: false
    default_status_when_absent: Final
    status_authority: review_author
    numbering_authority: pull_request
    location: architecture/reviews/
    external_review_required: false
    purpose: Review evidence and finding resolution history.
  ExecutableReference:
    normative_level: advisory
    lifecycle: [Experimental, Reference, Deprecated]
    status_authority: Architecture Board
    numbering_authority: repository_path
    location: tools/
    external_review_required: false
    purpose: Executable validation that implements but does not redefine normative artifacts.
  DerivedProjection:
    normative_level: record
    lifecycle: [Draft, Generated, Archived]
    status_authority: generator_contract
    numbering_authority: repository_path
    location: architecture/baselines/
    external_review_required: false
    generated_sections_hand_editable: false
    purpose: Deterministic projection generated from authoritative repository metadata; curated intent remains in separate record inputs.
  Backlog:
    normative_level: record
    lifecycle: [Open, Planned, Deferred, Resolved]
    status_authority: Architecture Board
    numbering_authority: owning_registry
    location: backlog/
    external_review_required: false
    purpose: Planned work and unresolved questions.
commit_convention:
  pull_request_title: "PR-NNNN[LETTER] — Title"
  merge_method: squash
  linear_history_required: true
  history_audit_scope: post_baseline_reachable_commits
  history_audit_requires_complete_history: true
  history_audit_baseline: fc15d2dfc6d0529735347d8c78dd0e3e5225721d
  note: Branch protection is preventive; repository checks audit complete history after the governed legacy baseline.
