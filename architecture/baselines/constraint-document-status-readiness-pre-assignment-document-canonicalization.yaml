    ocp006_assessment: not-satisfied
    basis: machine-checks-exist-but-stable-dependency-and-separate-board-act-requirements-are-not-met
  - criterion_id: CANONICAL_DIRECT_DEPENDENCY_FLOOR_L2
    applies_to: [Canonical]
