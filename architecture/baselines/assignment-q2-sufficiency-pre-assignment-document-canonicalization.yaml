gate_first:
  evidence_form:
    ocp016_gate: G4
    applies: false
    positive_capable: false
    activation_created: false
    reason: insufficiency-evidence-adds-no-rule-result-profile-or-activation
  hypothetical_closures:
    SUPERSEDING_ASSIGNMENT_FOR_CHANGE:
      applies: true
      positive_capable: true
      reason: mandatory-successor-link-provenance-and-replay-mechanism-would-be-added
    POST_ESTABLISHMENT_IMMUTABILITY:
      applies: false
      positive_capable: false
      reason: pure-negative-prohibition-would-add-no-positive-capable-result-or-activation
      separate_board_lifecycle_act_required: true
sufficiency_criterion:
  declared_before_application: true
  order:
    - owner-selection
    - executable-discrimination
    - accepted-consumer-exclusion
    - unique-survivor-intersection
    - no-new-rule-required
  close_only_if:
    - one-class-is-directly-normative-or-necessarily-derived-from-an-explicitly-exhaustive-enumeration
    - executable-behavior-distinguishes-the-selected-class-from-its-alternative
    - accepted-consumer-evidence-excludes-the-alternative
    - pressure-and-current-norm-leave-exactly-one-q2-class
    - finalization-needs-no-new-mutation-prohibition-successor-provenance-or-replay-rule
  result: insufficient-for-q2-closure
argument_type_policy:
  direct_normative_statement:
    sufficient_alone_when: exact-current-owner-statement-selects-one-class-and-excludes-the-other
    current_sufficient_alone: false
    current_reason: traceability-is-direct-but-the-amendment-model-is-explicitly-open
  enumeration_inference:
    sufficient_alone_when: enumeration-is-explicitly-exhaustive-and-the-residual-treatment-is-necessary
    current_sufficient_alone: false
    current_reason: endpoint-immutability-and-lifecycle-lists-do-not-claim-exhaustive-field-mutation-semantics
  silence_inference:
    sufficient_alone_when: never
    current_sufficient_alone: false
    current_reason: absent-amendment-transition-does-not-prohibit-field-change-or-require-supersession
calibration:
  owner_selection: {Q3: direct-boundary-present, Q2: traceability-only-model-open, Q9: closed-world-boundary-absent}
  executable_discrimination: {Q3: present, Q2: absent-both-field-changes-accepted, Q9: absent-extra-interval-field-accepted}
  accepted_consumer_exclusion: {Q3: excludes-retroactive-classes, Q2: removes-in-place-only-two-remain, Q9: neutral-two-remain}
  survivor_intersection: {Q3: one-common-prospective-boundary, Q2: two-change-model-classes, Q9: two-cardinality-classes}
  no_new_rule_required: {Q3: true, Q2: false, Q9: false}
