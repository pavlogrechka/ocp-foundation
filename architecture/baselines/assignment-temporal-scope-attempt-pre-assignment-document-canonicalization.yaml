owner_text_evidence:
  - evidence_id: PRE_ESTABLISHMENT_EFFECTIVITY_ALREADY_FALSE
    zone: temporal
    path: docs/005-assignment-concept/README.md
    tokens:
      - established_at(Assignment) <= t
      - До окремого рішення про ретроактивне Establishment Assignment не може бути ефективним для часу раніше `established_at`.
    consequence: controls-effectivity-before-the-recorded-establishment-instant-only
  - evidence_id: NO_ESTABLISHMENT_RECORDING_TIME_AXIS
    zone: temporal
    path: docs/005-assignment-concept/README.md
    tokens:
      - occurred_at of the unique Draft → Established record
      - AssignmentTransitionRecord
      - provenance_ref
      - Чи допускається ретроактивне Establishment Assignment?
    consequence: cannot-distinguish-original-from-later-backdated-establishment-record
  - evidence_id: SINGLE_INTERVAL_MINIMUM_IS_NOT_CLOSED_WORLD
    zone: temporal
    path: docs/005-assignment-concept/README.md
    tokens:
      - applicability_start
      - applicability_end [optional]
      - Цей перелік визначає мінімальні перевірні поля Concept, але не є схемою бази даних чи API.
      - Чи може один Assignment мати кілька неперервних applicability intervals
    consequence: singular-minimum-does-not-prohibit-an-additional-interval-representation
  - evidence_id: DIRECT_REFERENCE_NON_INHERITANCE_ONLY
    zone: partial_scope
    path: docs/005-assignment-concept/README.md
    tokens:
      - Assignment застосовується лише до Resource та Operation, указаних безпосередньо в його references.
      - Assignment складеного Resource не створює Assignment для його складових Resource
      - Механізми явного успадкування або масового створення Assignment можуть бути визначені окремими правилами
    consequence: rejects-automatic-component-assignment-inference-not-explicit-partial-scope
  - evidence_id: ONE_RESOURCE_REFERENCE_IS_NOT_PART_IDENTITY
    zone: partial_scope
    path: docs/005-assignment-concept/README.md
    tokens:
      - один Assignment не може групувати кілька Resource або кілька Operation.
      - один Resource, який сам представляє визначену групу
      - окремий Assignment для кожного Resource.
    consequence: grouping-boundary-does-not-decide-subject-identity-for-a-part
  - evidence_id: PARTIAL_SCOPE_QUESTION_EXPLICITLY_OPEN
    zone: partial_scope
    path: docs/005-assignment-concept/README.md
    tokens:
      - Чи повинен Assignment мати окремий scope для частини складеного Resource без створення нового Resource?
    consequence: owner-contract-does-not-select-prohibition-or-positive-scope-form
