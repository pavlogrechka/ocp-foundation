name: ontology-checker

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reference-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/ontology_checker/requirements.txt

      - name: Install checker dependency
        run: python -m pip install -r tools/ontology_checker/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tools/ontology_checker/tests -v

      - name: Validate reference fixtures
        run: python tools/ontology_checker/check.py tools/ontology_checker/fixtures

      - name: Validate proposed head in main audit context
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$PR_HEAD_SHA"
          python tools/ontology_checker/check.py tools/ontology_checker/fixtures --context main
