name: AB022 review builder

on:
  push:
    branches:
      - agent/ab-022-review-builder

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repair builder transport newline
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.ab022/apply_review_resolution.py')
          text = path.read_text(encoding='utf-8')
          old = 'test_text = test_path.read_text(encoding="utf-8")ntest_text = test_text.replace('
          new = 'test_text = test_path.read_text(encoding="utf-8")\ntest_text = test_text.replace('
          if text.count(old) != 1:
              raise SystemExit(f'expected one transport-newline defect, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Materialize review resolution
        run: python .ab022/apply_review_resolution.py
      - name: Run unit tests
        run: python -m unittest discover -s tools/ontology_checker/tests -v
      - name: Validate fixtures and repository projections
        run: python tools/ontology_checker/check.py tools/ontology_checker/fixtures
      - name: Commit materialized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/004-operation-concept/README.md \
            tools/ontology_checker/README.md \
            tools/ontology_checker/ocp_checker/objective.py \
            tools/ontology_checker/rules.yaml \
            tools/ontology_checker/tests/test_operation_intent_contract.py \
            tools/ontology_checker/fixtures/operation/invalid-planned-explicit-intent-missing-evidence.yaml \
            tools/ontology_checker/fixtures/operation/invalid-planned-explicit-intent-stale-evidence.yaml \
            tools/ontology_checker/fixtures/operation/invalid-planned-explicit-intent-conflicting-evidence.yaml \
            tools/ontology_checker/fixtures/operation/invalid-planned-explicit-intent-permissive-projection.yaml \
            tools/ontology_checker/fixtures/operation/valid-planned-explicit-intent-agreeing-repeat.yaml
          git commit -m 'build: materialize AB-022 review resolution'
          git push origin HEAD:${GITHUB_REF_NAME}
