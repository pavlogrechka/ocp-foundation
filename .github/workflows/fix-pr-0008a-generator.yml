name: fix-pr-0008a-generator
on:
  push:
    branches: [agent/pr-0008a-concept-dependency-migration]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr-0008a-concept-dependency-migration
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pr-0008a-atomic-migration.yml')
          t=p.read_text()
          old="          test='''from __future__ import annotations"
          new="          test=r'''from __future__ import annotations"
          if old not in t:
              raise RuntimeError('test generator marker not found')
          p.write_text(t.replace(old,new,1))
          PY
          rm .github/workflows/fix-pr-0008a-generator.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: fix PR-0008A generator escaping'
          git push origin HEAD:agent/pr-0008a-concept-dependency-migration
