name: pr-0008a-executor
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr-0008a-concept-dependency-migration
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/pr-0008a-final-runner.yml').read_text()
          block=source.split("          python - <<'PY'\n",1)[1].split("\n          PY",1)[0]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          replacement='start=t.index("During PR-0008 implementation"); end=t.index("\\n\\nThe generator rejects:",start); t=t[:start]+new+t[end:]'
          found=False
          for index,line in enumerate(lines):
              if line.startswith('t,n=re.subn('):
                  lines[index]=replacement
                  found=True
                  break
          if not found:
              raise RuntimeError('baseline rewrite statement not found')
          exec(compile('\n'.join(lines),'pr0008a-migration','exec'))
          PY
          python -m unittest discover -s tools/ontology_checker/tests -v
          python tools/ontology_checker/check.py --context=pr
          python tools/ontology_checker/check.py --context=main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs architecture/baselines backlog tools/ontology_checker
          TREE_SHA=$(git write-tree)
          git commit -m "PR-0008A — Complete Concept Dependency Source Migration" -m "Atomic migration. Tree: ${TREE_SHA}"
          git push origin HEAD:agent/pr-0008a-concept-dependency-migration
